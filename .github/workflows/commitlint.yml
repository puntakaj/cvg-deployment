
# .github/workflows/commitlint.yml
name: Commit message lint

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

jobs:
  commitlint:
    # ✅ รันเฉพาะ PR ที่ base เป็น main
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install commitlint
        run: npm i -D @commitlint/cli @commitlint/config-conventional

      - name: Provide commitlint config (CommonJS)
        shell: bash
        run: |
          cat > commitlint.config.js <<'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [2, 'always', [
                'feat','fix','docs','style','refactor',
                'perf','test','build','ci','chore','revert'
              ]],
              'subject-empty': [2, 'never'],
            },
          };
          EOF

      - name: Lint commits in this PR (base.sha → head.sha)
        shell: bash
        run: |
          FROM="${{ github.event.pull_request.base.sha }}"
          TO="${{ github.event.pull_request.head.sha }}"
          echo "Linting commits from $FROM to $TO"
          npx commitlint --from "$FROM" --to "$TO"

